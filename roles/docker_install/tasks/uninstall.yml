---
- name: Stop and disable Docker service
  ansible.builtin.service:
    name: docker
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Remove Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: absent
    purge: yes

- name: Remove Docker prerequisites (optional, usually kept)
  ansible.builtin.apt:
    name: python3-docker
    state: absent

- name: Remove Docker repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Remove Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    state: absent

- name: "Remove Docker data directory (Warning: Deletes all containers/images)"
  ansible.builtin.file:
    path: /var/lib/docker
    state: absent
